[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keppi"
version = "0.1.0"
description = "Keppi — Knowledge Graph Context Engine for Obsidian vaults and markdown directories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Keppi Contributors", email = "keppi@users.noreply.github.com" },
]
keywords = ["obsidian", "knowledge-graph", "pkm", "mcp", "graph", "notes", "keppi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "networkx>=3.2",
    "python-frontmatter>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "toml>=0.10.2",
    "mcp[cli]>=1.27.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27.0",
]

[project.scripts]
keppi = "keppi.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
embeddings = [
    "sqlite-vec>=0.1.6",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
